ont-family="sans-serif" font-size="17" fill="#354c5d">sık duyulan cümlelerden biri) You can use my pen.</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">(İzin vermek) You can&#x27;t p</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>