<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Kelime Nasıl Öğrenilir? Kalıcı Öğrenme Rehberi</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Kelime Nasıl Öğrenilir? Kalıcı Öğrenme Rehberi</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Can I borrow your pencil? sorusunda konuşan kalemi</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">ödünç almak ister. Can you lend me your pencil? aynı</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">isteği karşıdaki kişinin verme eylemi üzerinden</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">anlatır. İki cümleyi sınıfta</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Kelimeler her cümlede bire bir Türkçe karşılığa</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">dönüşmez. Look for aramak, look at bakmak demektir.</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">Sözcük grubunu birlikte kaydet; her parçayı ayrı ayrı</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">çevirerek cümlenin anlamın</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">1. Can I ___ your ruler? (borrow/lend) 2. Can you ___</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">me a book? 3. I cannot find my bag. I am looking ___</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">it. (for/at) Ardından bir eşyayı ödünç isteme</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">diyaloğu yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>