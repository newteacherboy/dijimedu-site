<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><title>7. Sınıf İçin Family Life &amp; Home: Ek İngilizce Çalışması</title><rect width="1200" height="780" rx="24" fill="#edf7f8"/><rect width="1200" height="155" fill="#123949"/><text x="45" y="48" font-family="sans-serif" font-size="20" fill="#74e4d3">DİJİMEDU / 7. SINIF İÇİN EK ÇALIŞMA</text><text x="45" y="95" font-family="sans-serif" font-size="30" fill="white">Family Life &amp; Home</text><rect x="45" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">family</text><text x="65" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">aile</text><text x="65" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">My family has dinner together.</text><rect x="605" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">parent</text><text x="625" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">ebeveyn</text><text x="625" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">A parent can help with this activity.</text><rect x="45" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">mother</text><text x="65" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">anne</text><text x="65" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">My mother likes reading.</text><rect x="605" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">father</text><text x="625" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">baba</text><text x="625" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">My father is cooking dinner.</text><rect x="45" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">sister</text><text x="65" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">kız kardeş</text><text x="65" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">My sister plays chess.</text><rect x="605" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">brother</text><text x="625" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">erkek kardeş</text><text x="625" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">My brother is at school.</text><text x="45" y="757" font-family="sans-serif" font-size="18" fill="#075b66">Anlam • Bağlam • Kendi cümlen</text></svg>