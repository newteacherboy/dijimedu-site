<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>Ortaokulda İngilizce Yazma Becerisi Nasıl Geliştirilir?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">Ortaokulda İngilizce Yazma Becerisi Nasıl Geliştirilir?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">My favourite place at school is the library. I go</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">there during the lunch break. It is quiet, so I can</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">read comfortably. Bu metin bir yer seçer, oraya ne</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">zaman gidildiğini belirtir</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Türkçedeki her sözcüğü sırayla İngilizceye taşımak</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">yerine İngilizce modelin cümle düzenini kullan. Son</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">kontrolde özne-fiil uyumu, büyük harf ve noktalama</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">için ayrı ayrı oku. Aynı a</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">My friend like music. She go to the club on friday.</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">It is fun because. metnini düzelt. Ardından kendi</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">okulundaki bir yer hakkında üç bağlı cümle yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>