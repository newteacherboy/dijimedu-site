<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>A2 Kısa Hikâyeler: Günlük Sorunlara Çözümler</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">A2 Kısa Hikâyeler: Günlük Sorunlara Çözümler</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Günlük yaşamdan üç özgün A2 hikâye</text><text x="70" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bu öykülerde küçük bir sorun, bir karar ve sonuç var.</text><text x="70" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">Olayın hangi adımla çözüldüğünü bulmaya çalış. Geçmiş</text><text x="70" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">zaman fiillerini ve neden-sonuç bağlaçlarını</text><text x="70" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">işaretle.</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">İlk okumada neye bakmalı?</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Okuma ve dinlemede bir ayrıntı tüm cümlenin anlamını</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">değiştirebilir. Buradaki amaç yanlış otobüse binme,</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">kayıp not bulma ve bir planı değiştirme gibi küçük</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">olayları çözmek. Önce cü</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Metin ve anlam ipuçları</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: Mina missed the bus but found</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">another route. Türkçesi: Mina otobüsü kaçırdı ama</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">başka bir yol buldu.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>