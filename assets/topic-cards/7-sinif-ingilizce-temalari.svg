<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>7. Sınıf İngilizce Temaları ve Çalışma Rehberi</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">7. Sınıf İngilizce Temaları ve Çalışma Rehberi</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Ece is tall and friendly. She usually plays</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">basketball after school. Last Saturday, her team won</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">a match. Bu üç cümle görünüş ve kişiliği, alışkanlığı</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">ve geçmiş olayı farklı yapıla</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Tall ve friendly aynı tür bilgi vermez: biri fiziksel</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">özellik, diğeri kişilik özelliğidir. Usually bir</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">rutin ipucu verirken last Saturday geçmişte bitmiş</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">bir zamana işaret eder. He</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">1. Görünüş bildiren sözcüğü bul. 2. Kişilik bildiren</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">sözcüğü bul. 3. Alışkanlık cümlesini yaz. 4. Takımın</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">ne zaman kazandığını belirt.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>