<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><title>Life in the Neighbourhood, City &amp; Social Life: Ek İngilizce Çalışması</title><rect width="1200" height="780" rx="24" fill="#edf7f8"/><rect width="1200" height="155" fill="#123949"/><text x="45" y="48" font-family="sans-serif" font-size="20" fill="#74e4d3">DİJİMEDU / KONUYA GÖRE İNGİLİZCE</text><text x="45" y="95" font-family="sans-serif" font-size="30" fill="white">Life in the Neighbourhood, City &amp; Social Life</text><rect x="45" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">neighbourhood</text><text x="65" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">mahalle</text><text x="65" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">There is a park in our neighbourhood.</text><rect x="605" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">street</text><text x="625" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">sokak</text><text x="625" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">Our school is on this street.</text><rect x="45" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">city</text><text x="65" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">şehir</text><text x="65" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">Ankara is a large city.</text><rect x="605" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">museum</text><text x="625" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">müze</text><text x="625" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">We visited the museum yesterday.</text><rect x="45" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">park</text><text x="65" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">park</text><text x="65" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">We play in the park.</text><rect x="605" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">hospital</text><text x="625" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">hastane</text><text x="625" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">A doctor works at a hospital.</text><text x="45" y="757" font-family="sans-serif" font-size="18" fill="#075b66">Anlam • Bağlam • Kendi cümlen</text></svg>