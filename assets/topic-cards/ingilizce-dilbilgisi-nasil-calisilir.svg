<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Dil Bilgisi Nasıl Çalışılır?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Dil Bilgisi Nasıl Çalışılır?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Ela plays tennis on Fridays. cümlesinde plays</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">alışkanlığı anlatır. Ela is playing tennis now.</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">cümlesinde is playing şu andaki işi anlatır. İki</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">cümlede de özne aynı kaldığı hâlde za</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Does she plays? sorusunda iki kez üçüncü tekil kişi</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">işareti kullanılmış olur. Soru does ile kurulduğunda</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">ana fiil play biçimine döner. Sadece doğru cümleyi</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">kopyalamak yerine yardım</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">1. She ___ to school every day. (walk) 2. She ___ to</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">school now. (walk) 3. Does he ___ football? (play) 4.</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">They is ready. cümlesini düzelt.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>