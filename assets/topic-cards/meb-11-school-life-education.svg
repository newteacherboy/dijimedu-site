<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><title>11. Sınıf İçin School Life &amp; Education: Ek İngilizce Çalışması</title><rect width="1200" height="780" rx="24" fill="#edf7f8"/><rect width="1200" height="155" fill="#123949"/><text x="45" y="48" font-family="sans-serif" font-size="20" fill="#74e4d3">DİJİMEDU / 11. SINIF İÇİN EK ÇALIŞMA</text><text x="45" y="95" font-family="sans-serif" font-size="30" fill="white">School Life &amp; Education</text><rect x="45" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">school</text><text x="65" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">okul</text><text x="65" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">Our school has a library.</text><rect x="605" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">student</text><text x="625" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">öğrenci</text><text x="625" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">Each student has a notebook.</text><rect x="45" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">teacher</text><text x="65" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">öğretmen</text><text x="65" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">Our teacher is in the classroom.</text><rect x="605" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">lesson</text><text x="625" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">ders</text><text x="625" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">Our lesson starts at nine.</text><rect x="45" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">course</text><text x="65" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">kurs; ders</text><text x="65" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">I am taking an English course.</text><rect x="605" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">project</text><text x="625" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">proje</text><text x="625" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">We are working on a science project.</text><text x="45" y="757" font-family="sans-serif" font-size="18" fill="#075b66">Anlam • Bağlam • Kendi cümlen</text></svg>