<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>What, Where, When, Who, Why, How: Soru Kelimeleri</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">What, Where, When, Who, Why, How: Soru Kelimeleri</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Hedef ve malzeme seçimi</text><text x="70" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Etkinlik tasarlarken öğrencinin hangi davranışı</text><text x="70" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">yapacağını somutlaştırmak gerekir. Burada hangi</text><text x="70" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">bilgiyi istediğine göre doğru soru sözcüğünü seçmek.</text><text x="70" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">Örnek görev anlaşılır ve ulaşıl</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Model etkinlik ve örnek</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: Where do you live? Türkçesi:</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">Nerede yaşıyorsun?.</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Uygulama adımları</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Etkinliği üç tura ayır: öğretmen veya veli önce bir</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">örnek göstersin, ikinci turda öğrenci ipucuyla</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">çalışsın, üçüncü turda desteği azaltarak bağımsız</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">deneme yapsın. Hızlı bitirenler</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>