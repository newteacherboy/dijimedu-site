<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>Ortaokulda İngilizce Konuşma Pratiği Nasıl Yapılır?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">Ortaokulda İngilizce Konuşma Pratiği Nasıl Yapılır?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">A öğrencisi: Art club - Monday - Room 2. B öğrencisi</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">bu bilgileri görmez ve When does it meet? / Where</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">does it meet? diye sorar. A, It meets on Monday in</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">Room 2. yanıtını verir. So</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Öğrencinin her küçük hatasında sözünü kesmek</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">akıcılığı bozabilir. İletişimi engellemeyen bir</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">hatayı not alıp turun sonunda modelle düzelt. Öğrenci</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">anlaşılmadığında Could you repeat</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Art club: Monday, Room 2. Music club: Friday, Room 5.</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">İki farklı rol kartı oluştur. Her rol için iki soru</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">ve iki yanıt yaz; bir kez tekrar isteme ifadesi</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">kullan.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>