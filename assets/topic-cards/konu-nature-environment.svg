<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><title>Life in Nature: Ek İngilizce Çalışması</title><rect width="1200" height="780" rx="24" fill="#edf7f8"/><rect width="1200" height="155" fill="#123949"/><text x="45" y="48" font-family="sans-serif" font-size="20" fill="#74e4d3">DİJİMEDU / KONUYA GÖRE İNGİLİZCE</text><text x="45" y="95" font-family="sans-serif" font-size="30" fill="white">Life in Nature</text><rect x="45" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">nature</text><text x="65" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">doğa</text><text x="65" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">We must protect nature.</text><rect x="605" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">forest</text><text x="625" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">orman</text><text x="625" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">Many animals live in the forest.</text><rect x="45" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">river</text><text x="65" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">nehir</text><text x="65" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">The river flows through the city.</text><rect x="605" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">mountain</text><text x="625" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">dağ</text><text x="625" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">The mountain is covered in snow.</text><rect x="45" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">animal</text><text x="65" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">hayvan</text><text x="65" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">A cat is an animal.</text><rect x="605" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">plant</text><text x="625" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">bitki</text><text x="625" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">This plant needs water.</text><text x="45" y="757" font-family="sans-serif" font-size="18" fill="#075b66">Anlam • Bağlam • Kendi cümlen</text></svg>