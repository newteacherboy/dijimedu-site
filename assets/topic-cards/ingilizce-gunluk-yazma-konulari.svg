<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Günlük: Yedi Başlangıç Konusu</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Günlük: Yedi Başlangıç Konusu</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Today I got up early. I had</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">breakfast with my family.</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Örnek kullanım</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">I like the park near my house. It</text><text x="630" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">is quiet and green.</text><text x="630" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Örnek kullanım</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">My new word is &#x27;borrow&#x27;. Can I</text><text x="70" y="504.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">borrow a book?</text><text x="70" y="538.0" font-family="sans-serif" font-size="17" fill="#354c5d">Örnek kullanım</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>