<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>LGS İngilizce Deneme Analizi Nasıl Yapılır?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">LGS İngilizce Deneme Analizi Nasıl Yapılır?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bir davet sorusunda I would love to, but... yanıtını</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">kabul sandığını düşün. Hata kaydı: kelime eksikliği</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">değil, karşıtlık bağlacını kaçırma. Düzeltme görevi:</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">but içeren üç yanıtı k</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Her yanlış için yeni bir konu anlatımı bitirmek</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">gerekmez. Hata yalnızca soru kökündeki NOT</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">ifadesinden kaynaklanıyorsa uygun görev, aynı metin</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">için olumlu ve olumsuz iki soru yazma</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Kayıt tablosunu doldur: soru türü / yanlışın nedeni /</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">metindeki kanıt / düzeltme görevi / ertesi gün</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">sonucu. I would love to join, but I am busy.</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">cümlesini sınıflandır ve kanıtını</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>