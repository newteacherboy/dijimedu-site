<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><title>7. Sınıf İçin Life in the World &amp; Culture: Ek İngilizce Çalışması</title><rect width="1200" height="780" rx="24" fill="#edf7f8"/><rect width="1200" height="155" fill="#123949"/><text x="45" y="48" font-family="sans-serif" font-size="20" fill="#74e4d3">DİJİMEDU / 7. SINIF İÇİN EK ÇALIŞMA</text><text x="45" y="95" font-family="sans-serif" font-size="30" fill="white">Life in the World &amp; Culture</text><rect x="45" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">country</text><text x="65" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">ülke</text><text x="65" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">Which country are you from?</text><rect x="605" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">culture</text><text x="625" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">kültür</text><text x="625" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">Food is part of a country’s culture.</text><rect x="45" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">language</text><text x="65" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">dil</text><text x="65" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">English is a language.</text><rect x="605" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">tradition</text><text x="625" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">gelenek</text><text x="625" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">Visiting relatives is a family tradition.</text><rect x="45" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">festival</text><text x="65" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">festival</text><text x="65" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">We attended a music festival.</text><rect x="605" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">food</text><text x="625" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">yiyecek</text><text x="625" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">What is your favourite food?</text><text x="45" y="757" font-family="sans-serif" font-size="18" fill="#075b66">Anlam • Bağlam • Kendi cümlen</text></svg>