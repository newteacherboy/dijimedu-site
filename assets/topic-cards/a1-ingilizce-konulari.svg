<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>A1 İngilizce Konuları: Başlangıç Seviyesi Çalışma Rehberi</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">A1 İngilizce Konuları: Başlangıç Seviyesi Çalışma Rehberi</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">My name is Ada. I am ten. I live in Ankara. I like</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">drawing. I can swim. Beş cümle sırasıyla isim, yaş,</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">yaşanılan yer, ilgi ve yetenek bildirir. Modeli</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">ezberlemek yerine bilgileri k</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">I am like drawing. cümlesinde am gereksizdir: I like</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">drawing. Buna karşılık I ten years old. eksiktir: I</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">am ten years old. Be fiilinin gerekli olduğu kimlik</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">veya durum cümlesiyle e</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">1. My name ___ Ece. 2. I ___ eleven years old. 3. I</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">___ football. (like) 4. Where ___ you live? 5. Kendin</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">hakkında üç gerçek cümle yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>