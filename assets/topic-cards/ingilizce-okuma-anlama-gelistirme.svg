<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Okuma Anlama Nasıl Geliştirilir?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Okuma Anlama Nasıl Geliştirilir?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Mina wants to join the art club. It meets on Monday,</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">but she has a swimming lesson that day. She chooses</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">the science club because it meets on Thursday.</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">Metinde Mina sanatı sevse de</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Mina joins the art club. yargısı ilk cümleye</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">bakılarak seçilirse yanlış olur. Wants to bir isteği,</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">chooses ise sonucu gösteriyor. But ve because</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">sözcükleri bilgilerin birbirine nas</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">1. Which club does Mina choose? 2. Why does she not</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">join the art club? 3. Which day does the science club</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">meet? 4. Kararı açıklayan İngilizce ifadeyi metinden</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>