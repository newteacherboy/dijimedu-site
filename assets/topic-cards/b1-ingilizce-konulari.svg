<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>B1 İngilizce Konuları ve Orta Seviye Çalışma Rehberi</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">B1 İngilizce Konuları ve Orta Seviye Çalışma Rehberi</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Our school wants to start a reading club. Some</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">students prefer printed books because screens make</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">them tired. Others want digital books because they</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">are easy to carry. I think the</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Görüş ile kanıt aynı şey değildir. Digital books are</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">better. bir görüştür; bunun nedenini ve hangi durumda</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">geçerli olduğunu açıklamak gerekir. Bir karşı görüşe</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">yer vermek, kendi fi</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Model metinde iki tercihi bul. Ardından okul kulübü</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">için basılı veya dijital kaynak seçimini 60-80</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">İngilizce sözcükle savun. Bir gerekçe, bir somut</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">örnek ve bir karşı görüş ekle.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>