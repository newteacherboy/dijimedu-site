<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Kendini Tanıtma: Hazır Cümleler ve Örnek Metinler</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Kendini Tanıtma: Hazır Cümleler ve Örnek Metinler</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Selamlaşma ile başla</text><text x="70" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Kendini tanıtmadan önce ortama uygun bir selam vermek</text><text x="70" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">iyi bir izlenim bırakır.</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">İsim ve yaş</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">My name is Elif. / I&#x27;m Elif. – Benim adım Elif. My</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">surname is Kaya. – Soyadım Kaya. You can call me Eli.</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">– Bana Eli diyebilirsin. I&#x27;m twelve years old. / I&#x27;m</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">twelve. – On iki yaşın</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Nereli olduğun ve nerede yaşadığın</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">I&#x27;m from Turkey. / I&#x27;m Turkish. – Türkiyeliyim. /</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">Türk&#x27;üm. I&#x27;m from Trabzon, but I live in İstanbul. –</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">Trabzonluyum ama İstanbul&#x27;da yaşıyorum. I live in a</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">small town near the sea.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>