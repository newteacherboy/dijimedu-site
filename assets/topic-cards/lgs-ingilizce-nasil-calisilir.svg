<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>LGS İngilizce Nasıl Çalışılır? Etkili Çalışma Rehberi</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">LGS İngilizce Nasıl Çalışılır? Etkili Çalışma Rehberi</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Invitation: Join our book club on Friday at 4 p.m.</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bring your favourite book. Reply: I would love to,</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">but I have a dentist appointment then. Yanıt daveti</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">nazikçe reddeder. Love söz</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bütün bilinmeyen sözcükleri çözmeden de sorunun</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">gerektirdiği bilgiyi bulabilirsin. Buna karşılık not</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">veya except sözcüğünü kaçırmak bildiğin bir soruda</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">hataya yol açabilir. Sorunun</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">1. Davet hangi gün ve saatte? 2. Yanıt kabul mü ret</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">mi? 3. Gerekçe nedir? 4. Aynı davete kabul bildiren</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">iki cümlelik bir yanıt yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>