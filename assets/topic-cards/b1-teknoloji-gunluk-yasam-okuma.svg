<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>B1 Okuma: Teknoloji ve Günlük Yaşam</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">B1 Okuma: Teknoloji ve Günlük Yaşam</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Useful Apps, Better Choices — Özgün</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">B1 metni</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Many people use digital tools to organise their day.</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">A calendar can remind us about lessons, meetings and</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">birthdays. A vocabulary app can also make short</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">practice sessions easier t</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">İlk okumada neye bakmalı?</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Okuma ve dinlemede bir ayrıntı tüm cümlenin anlamını</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">değiştirebilir. Buradaki amaç ekran bildirimi ve</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">dijital planlamanın avantaj ve sınırlılıklarını</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">tartışmak. Önce cümlenin konus</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Metin ve anlam ipuçları</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: A calendar app can save time,</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">although notifications may distract us. Türkçesi:</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">Takvim uygulaması zaman kazandırabilir ancak</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">bildirimler dikkat dağıtabilir.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>