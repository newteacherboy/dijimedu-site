<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İlkokul İçin Ekransız İngilizce Oyunları: 10 Etkinlik</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İlkokul İçin Ekransız İngilizce Oyunları: 10 Etkinlik</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Evde veya sınıfta oynanabilecek 10</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">ekransız oyun</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Etkinlikler kısa süreli ve basit malzemelidir.</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">Çocuğun yaşına ve sınıfın hareket alanına göre</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">güvenli, erişilebilir seçenekler kullan.</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Hedef ve malzeme seçimi</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Etkinlik tasarlarken öğrencinin hangi davranışı</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">yapacağını somutlaştırmak gerekir. Burada evde veya</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">sınıfta kart, nesne, taklit ve hareketle kısa</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">etkinlikler yapmak. Örnek görev an</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Model etkinlik ve örnek</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: Teacher: Touch something blue!</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">Türkçesi: Mavi bir şeye dokun!.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>