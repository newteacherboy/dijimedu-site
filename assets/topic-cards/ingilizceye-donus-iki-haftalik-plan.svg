<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>Ara Verenler İçin İki Haftalık İngilizce Çalışma Planı</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">Ara Verenler İçin İki Haftalık İngilizce Çalışma Planı</text><rect x="48" y="205.0" width="544" height="150.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">1</text><text x="70" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Beş sık kullanılan selamlaşma kalıbını hatırla.</text><rect x="608" y="205.0" width="544" height="150.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">2</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Günlük rutin fiillerini seç: get up, eat, go, read.</text><rect x="48" y="367.0" width="544" height="150.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="402.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">3</text><text x="70" y="436.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bir A1 paragrafını oku ve ana fikri söyle.</text><rect x="608" y="367.0" width="544" height="150.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="402.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">4</text><text x="630" y="436.0" font-family="sans-serif" font-size="17" fill="#354c5d">What, Where ve When sorularına çalış.</text><rect x="48" y="529.0" width="544" height="150.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="564.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">5</text><text x="70" y="598.0" font-family="sans-serif" font-size="17" fill="#354c5d">Önceki dört günü kısa tekrar et.</text><rect x="608" y="529.0" width="544" height="150.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="564.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">6</text><text x="630" y="598.0" font-family="sans-serif" font-size="17" fill="#354c5d">Yiyecek ve içecekleri konuş.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>