<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Kelime Defteri Nasıl Tutulur?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Kelime Defteri Nasıl Tutulur?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">light — hafif: My bag is light. / turn on — açmak:</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">Turn on the light. Aynı sözcük iki farklı cümlede</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">farklı görev üstleniyor. Defterinde bu örnekleri yan</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">yana yerleştir.</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Yalnızca kelimenin rengini değiştirmek hatırlama</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">denemesi değildir. İngilizce tarafı kapatıp Türkçe</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">ipucundan cümleyi yeniden kur. Kuramıyorsan sözcüğü</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">unuttun diye bütün sayfayı k</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">light sözcüğünü The room is dark. Turn on the light.</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">bağlamında açıkla. Ardından My bag is light.</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">cümlesindeki farkı yaz. Üç yeni kelime için dört</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">sütunlu defter kaydı oluştur.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>