<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>Oyunlarla İngilizce Öğrenme: Eğlenirken Çalışmak Mümkün mü?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">Oyunlarla İngilizce Öğrenme: Eğlenirken Çalışmak Mümkün mü?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Nesne bulma oyununda bir öğrenci bir eşyayı tarif</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">eder: It is small. It is yellow. We write with it.</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">Diğeri Is it a pencil? diye sorar. Cevap bulunduğunda</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">roller değişir. Puan iste</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">En hızlı cevap verenin sürekli kazanması daha yavaş</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">düşünen öğrenciyi dışarıda bırakabilir. Önce düşünme</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">süresi ver, sonra eşli yanıt al. Sonuçta yalnızca</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">kazananı değil, hangi İng</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Sınıf için üç nesne seç. Her biri için adı söylemeden</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">iki İngilizce ipucu yaz. Eşin bir soru sorarak</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">bulmaya çalışsın. Oyunun sonunda kullandığınız iki</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">kalıbı kaydedin.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>