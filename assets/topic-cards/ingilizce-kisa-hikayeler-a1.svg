<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>A1 İngilizce Kısa Hikâyeler: 3 Metin, Sorular ve Cevaplar</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">A1 İngilizce Kısa Hikâyeler: 3 Metin, Sorular ve Cevaplar</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">What day is it?What colour is</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Lina’s bag?Who has a blue</text><text x="70" y="294.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">bike?Where do Lina and Tom sit?</text><text x="70" y="328.0" font-family="sans-serif" font-size="17" fill="#354c5d">Örnek kullanım</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">It is Saturday.It is green.Tom has</text><text x="630" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">a blue bike.They sit under a tree.</text><text x="630" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Örnek kullanım</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">How many desks are there?Who brings</text><text x="70" y="504.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">the plant?Where does Ada put the</text><text x="70" y="531.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">plant?When does Deniz water the</text><text x="70" y="565.0" font-family="sans-serif" font-size="17" fill="#354c5d">Örnek kullanım</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>