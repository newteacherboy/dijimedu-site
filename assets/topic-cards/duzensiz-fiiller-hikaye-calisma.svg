<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>Düzensiz Fiilleri Hikâye ve Cümlelerle Öğrenme</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">Düzensiz Fiilleri Hikâye ve Cümlelerle Öğrenme</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Yapının anlamını önce bul</text><text x="70" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bir dil bilgisi kuralının işe yarayıp yaramadığını</text><text x="70" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">anlamak için onu doğru zamanda kullanmalısın. Bu</text><text x="70" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">başlıkta temel amaç fiil listesini yeniden vermek</text><text x="70" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">yerine kısa olayları anlatırke</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Örnekleri kuralıyla karşılaştır</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: I went to the park and saw a dog.</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">Türkçesi: Parka gittim ve bir köpek gördüm.</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kuralı kendin kullan</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Şimdi birinci cümledeki özneyi değiştir; gerekirse</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">fiilin biçimini de güncelle. Ardından olumsuz veya</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">soru yapmayı dene. Örnekteki sözcükleri aynen korumak</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">zorunda değilsin, ancak</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>