<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>Konuşma Başlatan 30 Kısa İngilizce Soru ve Cevap</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">Konuşma Başlatan 30 Kısa İngilizce Soru ve Cevap</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">30 kısa İngilizce konuşma sorusu ve</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">yanıtı</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Soruları üç turda çalış: önce oku, ardından örnek</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">cevabı kapatıp kendin yanıtla, son turda bir takip</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">sorusu ekle. Yanıtlar kişiye göre değiştirilebilir.</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Mesajın ana fikrini belirle</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bir İngilizce metin ya da konuşma hazırlamadan önce</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">neyi anlatacağını seçmelisin. Bu sayfada tek</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">kelimelik yanıt yerine küçük takip sorularıyla sohbet</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">sürdürmek. Tek bir ana fikirl</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Örnek cümleleri incele</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: What do you do after school? I</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">play football. Türkçesi: Okuldan sonra ne yaparsın?</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">Futbol oynarım.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>