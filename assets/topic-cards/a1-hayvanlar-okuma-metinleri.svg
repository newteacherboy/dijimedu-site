<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>A1 Okuma: Hayvanlar Hakkında Üç Özgün Metin</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">A1 Okuma: Hayvanlar Hakkında Üç Özgün Metin</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Üç özgün A1 hayvan metni</text><text x="70" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bu metinler hayvanları yalnızca isimleriyle tanıtmaz;</text><text x="70" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">nerede yaşadıklarını ve neler yaptıklarını anlatır.</text><text x="70" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">Her metni okuyup altındaki soruları önce kendin</text><text x="70" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">cevapla.</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">İlk okumada neye bakmalı?</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Okuma ve dinlemede bir ayrıntı tüm cümlenin anlamını</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">değiştirebilir. Buradaki amaç üç farklı hayvanı yaşam</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">alanı, beslenme ve hareket üzerinden okumak. Önce</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">cümlenin konusu ve olay</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Metin ve anlam ipuçları</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: The otter swims in the river.</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">Türkçesi: Su samuru nehirde yüzer.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>