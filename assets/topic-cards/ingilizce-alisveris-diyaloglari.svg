<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Alışveriş: Fiyat, Beden ve Renk Sorma</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Alışveriş: Fiyat, Beden ve Renk Sorma</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Konuşmanın amacı ne?</text><text x="70" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Sözcükleri yerli yerinde kullanmak için bağlamı</text><text x="70" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">bilmek gerekir. Bu çalışmada bir ürünün fiyatını,</text><text x="70" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">rengini ve bedenini kısa konuşmayla öğrenmek. Kendine</text><text x="70" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">&#x27;Ben bu cümleyi kimden duyar</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">İki örnek diyalog veya cümle</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: How much is this jacket?</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">Türkçesi: Bu ceket ne kadar?.</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Durumu değiştirerek konuş</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Küçük bir rol oyunu hazırla: Bir kişi soruyu soran,</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">diğeri yanıt veren olsun. İlk turda örneği olduğu</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">gibi canlandır. İkinci turda yer, kişi veya ihtiyacı</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">değiştir. Üçüncü turda ya</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>