467" font-family="sans-serif" font-size="18" fill="#354c5d">Scientists study the universe.</text><rect x="45" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">robot</text><text x="65" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">robot</text><text x="65" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">The robot can move its arms.</text><rect x="605" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">technology</text><text x="625" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">teknoloji</text><text x="625" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">Technology can help us learn.</text><text x="45" y="757" font-family="sans-serif" font-size="18" fill="#075b66">Anlam • Bağlam • Kendi cümlen</text></svg>