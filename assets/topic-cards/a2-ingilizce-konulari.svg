t><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">kullan: We are going to v</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">1. We ___ to the park yesterday. (go) 2. We did not</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">___ a taxi. (take) 3. The bus is ___ than a taxi.</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">(cheap) 4. Yarın için because içeren bir plan yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>