<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>MEB Ortaokul İngilizce Programı: 5, 6, 7 ve 8. Sınıflar</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">MEB Ortaokul İngilizce Programı: 5, 6, 7 ve 8. Sınıflar</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">5. sınıf School Life temasında okul kişileri, yerler,</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">kurallar, kulüpler, ülkeler ve kutlamalar yer alır.</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bir uygulama bunları birkaç küçük çalışmaya</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">bölebilir. Bu çalışmaların num</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Farklı yıl veya sınıfa ait bir listeyi güncel</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">müfredat etiketiyle sunmak yanıltıcıdır. Örneğin 8.</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">sınıf kaynaklarında Friendship ve Teen Life gibi</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">ünite adları bulunur. Uygulamadak</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bir içerik için denetim tablosu hazırla: sınıf /</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">resmî tema adı / kaynak bağlantısı / hedef beceri /</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">hazırlanan etkinlik. School Life için bir yer sorma</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">sorusu ve yanıtı yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>