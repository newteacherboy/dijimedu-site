<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Çalışma Programı Nasıl Hazırlanır?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Çalışma Programı Nasıl Hazırlanır?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Pazartesi: beş okul kelimesiyle cümle yaz. Salı: aynı</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">kelimeleri içeren kısa bir metni okuyup iki bilgi</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">bul. Çarşamba: bu metni birinden dinleyip kişi ve</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">yerleri not et. Perşembe:</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Kaçırılan bir günü sonraki güne iki kat ödev olarak</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">aktarmak planı sürdürülemez kılabilir. Önce temel</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">görevi seç. Örneğin yalnızca beş dakika varsa iki</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">sözcüğü cümle içinde hatırla</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Beş günlük planında her gün için süre, görev ve ürün</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">yaz. Salı gününü kaçırdığını varsay: çarşamba planını</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">on beş dakikayı aşmadan yeniden düzenle.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>