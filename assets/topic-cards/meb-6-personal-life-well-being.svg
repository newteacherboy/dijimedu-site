<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><title>6. Sınıf İçin Personal Life &amp; Well-Being: Ek İngilizce Çalışması</title><rect width="1200" height="780" rx="24" fill="#edf7f8"/><rect width="1200" height="155" fill="#123949"/><text x="45" y="48" font-family="sans-serif" font-size="20" fill="#74e4d3">DİJİMEDU / 6. SINIF İÇİN EK ÇALIŞMA</text><text x="45" y="95" font-family="sans-serif" font-size="30" fill="white">Personal Life &amp; Well-Being</text><rect x="45" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">routine</text><text x="65" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">rutin</text><text x="65" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">Reading is part of my daily routine.</text><rect x="605" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">hobby</text><text x="625" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">hobi</text><text x="625" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">My hobby is drawing.</text><rect x="45" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">health</text><text x="65" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">sağlık</text><text x="65" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">Sleep is important for our health.</text><rect x="605" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">breakfast</text><text x="625" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">kahvaltı</text><text x="625" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">We have breakfast at eight.</text><rect x="45" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">exercise</text><text x="65" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">egzersiz</text><text x="65" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">Regular exercise is good for us.</text><rect x="605" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">feeling</text><text x="625" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">duygu</text><text x="625" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">Can you describe this feeling?</text><text x="45" y="757" font-family="sans-serif" font-size="18" fill="#075b66">Anlam • Bağlam • Kendi cümlen</text></svg>