<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>A1 ve A2 İngilizce Arasındaki Fark Nedir?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">A1 ve A2 İngilizce Arasındaki Fark Nedir?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">A1 örneği: I like museums. A2 örneği: I visited a</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">museum last weekend. It was interesting, but it was</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">crowded. İlk cümle bir tercih bildirir; ikinci anlatı</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">zaman, deneyim ve karşıt</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Uzun cümle otomatik olarak daha yüksek düzey demek</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">değildir. Anlaşılmayan uzun bir metin yerine kısa ve</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">tutarlı cümleler kurmak daha yararlıdır. Ayrıca bir</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">konuşma metnini ezberden</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">I like football. cümlesini bir zaman bilgisi ve bir</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">gerekçe ekleyerek genişlet. Bir arkadaşına ilgi alanı</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">hakkında iki takip sorusu yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>