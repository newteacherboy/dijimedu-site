<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Dinleme Nasıl Geliştirilir?</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Dinleme Nasıl Geliştirilir?</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">Okuma metni: Hello, this is Ela. Our science club</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">meets in the library on Tuesday at half past three.</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">Please bring a notebook. Bir öğretmen veya arkadaş bu</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">metni iki kez doğal hızd</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Duymadığın kelimeye takılıp kaydın kalanını kaçırma.</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">Boş alanı işaretle ve devam et. Sonradan metne</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">bakarken yalnızca yanlış duyulan ses grubunu incele.</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">Örneğin thirteen ile thirty</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">Metni görmeden dört alanı doldur: kulüp, yer, gün,</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">saat. Sonra götürülecek eşyayı yaz. Son dinlemede</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">cevabını değiştirdiysen hangi ipucunun etkili</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">olduğunu açıkla.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>