<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>6. Sınıf İngilizce Konuları ve Çalışma Rehberi</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">6. Sınıf İngilizce Konuları ve Çalışma Rehberi</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Çözülmüş örnek: anlamı nasıl</text><text x="70" y="267.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">kurarsın?</text><text x="70" y="301.0" font-family="sans-serif" font-size="17" fill="#354c5d">I am responsible for watering the plants. I water</text><text x="70" y="322.0" font-family="sans-serif" font-size="17" fill="#354c5d">them on Mondays and Thursdays. Eren checks the</text><text x="70" y="343.0" font-family="sans-serif" font-size="17" fill="#354c5d">windows before we leave. Bu görev paylaşımı metni</text><text x="70" y="364.0" font-family="sans-serif" font-size="17" fill="#354c5d">kişinin kim olduğunu, görevini ve</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Bu konuda sık karıştırılan nokta</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Responsible ile responsibility aynı görevde</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">kullanılmaz. I am responsible for watering the</text><text x="630" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">plants. ve Watering the plants is my responsibility.</text><text x="630" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">doğru modellerdir. Önce anlamı kavra</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi başına uygula</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">1. What is the speaker responsible for? 2. When does</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">the speaker do it? 3. What does Eren check? 4.</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">Kurgusal bir sınıf için iki görev cümlesi yaz.</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>