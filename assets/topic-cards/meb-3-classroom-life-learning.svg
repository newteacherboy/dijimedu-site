<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780"><title>3. Sınıf İçin Classroom Life &amp; Learning: Ek İngilizce Çalışması</title><rect width="1200" height="780" rx="24" fill="#edf7f8"/><rect width="1200" height="155" fill="#123949"/><text x="45" y="48" font-family="sans-serif" font-size="20" fill="#74e4d3">DİJİMEDU / 3. SINIF İÇİN EK ÇALIŞMA</text><text x="45" y="95" font-family="sans-serif" font-size="30" fill="white">Classroom Life &amp; Learning</text><rect x="45" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">classroom</text><text x="65" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">sınıf</text><text x="65" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">We study English in the classroom.</text><rect x="605" y="185" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="223" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">desk</text><text x="625" y="257" font-family="sans-serif" font-size="21" fill="#354c5d">öğrenci sırası</text><text x="625" y="290" font-family="sans-serif" font-size="18" fill="#354c5d">There is a pencil on my desk.</text><rect x="45" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">board</text><text x="65" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">tahta</text><text x="65" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">Look at the board, please.</text><rect x="605" y="362" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="400" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">subject</text><text x="625" y="434" font-family="sans-serif" font-size="21" fill="#354c5d">ders; konu</text><text x="625" y="467" font-family="sans-serif" font-size="18" fill="#354c5d">English is my favourite subject.</text><rect x="45" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="65" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">timetable</text><text x="65" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">ders programı</text><text x="65" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">Check your timetable before the lesson.</text><rect x="605" y="539" width="545" height="157" rx="15" fill="white" stroke="#c6e1e5"/><text x="625" y="577" font-family="sans-serif" font-weight="bold" font-size="26" fill="#075b66">rule</text><text x="625" y="611" font-family="sans-serif" font-size="21" fill="#354c5d">kural</text><text x="625" y="644" font-family="sans-serif" font-size="18" fill="#354c5d">Please follow the classroom rule.</text><text x="45" y="757" font-family="sans-serif" font-size="18" fill="#075b66">Anlam • Bağlam • Kendi cümlen</text></svg>