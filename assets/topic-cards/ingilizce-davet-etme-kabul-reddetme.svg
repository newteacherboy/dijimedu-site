<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="780" viewBox="0 0 1200 780" role="img"><title>İngilizce Davet Etme, Kabul ve Nazikçe Reddetme</title><rect width="1200" height="780" rx="28" fill="#edf7f8"/><path d="M0 0H1200V170H0Z" fill="#123949"/><text x="48" y="45" fill="#74e4d3" font-family="sans-serif" font-size="18" font-weight="bold">DİJİMEDU • KONU KARTI</text><text x="48" y="88" fill="white" font-family="sans-serif" font-size="30" font-weight="bold">İngilizce Davet Etme, Kabul ve Nazikçe Reddetme</text><rect x="48" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Mesajın ana fikrini belirle</text><text x="70" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">Bir İngilizce metin ya da konuşma hazırlamadan önce</text><text x="70" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">neyi anlatacağını seçmelisin. Bu sayfada arkadaşça</text><text x="70" y="316.0" font-family="sans-serif" font-size="17" fill="#354c5d">bir davet kurup karşı tarafın kararına saygı</text><text x="70" y="337.0" font-family="sans-serif" font-size="17" fill="#354c5d">göstermek. Tek bir ana fikirle b</text><rect x="608" y="205.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="630" y="240.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Örnek cümleleri incele</text><text x="630" y="274.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk örneğe bakalım: Would you like to join our game?</text><text x="630" y="295.0" font-family="sans-serif" font-size="17" fill="#354c5d">Türkçesi: Oyunumuza katılmak ister misin?.</text><rect x="48" y="442.0" width="544" height="225.0" rx="18" fill="white" stroke="#c6e1e5"/><text x="70" y="477.0" font-family="sans-serif" font-size="22" font-weight="bold" fill="#075b66">Kendi taslağını oluştur</text><text x="70" y="511.0" font-family="sans-serif" font-size="17" fill="#354c5d">İlk denemende üç cümlelik küçük bir taslak kur.</text><text x="70" y="532.0" font-family="sans-serif" font-size="17" fill="#354c5d">Birinci cümle ana bilgiyi versin, ikinci cümle örnek</text><text x="70" y="553.0" font-family="sans-serif" font-size="17" fill="#354c5d">ya da gerekçe eklesin, üçüncü cümle mesajı kapatsın.</text><text x="70" y="574.0" font-family="sans-serif" font-size="17" fill="#354c5d">Daha sonra fazlalıkları çı</text><text x="48" y="752" font-family="sans-serif" font-size="18" fill="#075b66">Örneği incele • Kendi cevabını oluştur • Etkinlik kâğıdıyla kontrol et</text></svg>